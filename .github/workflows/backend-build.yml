name: Backend Build Diagnosis

on:
  push:
    branches:
      - fix/backend-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./dev.db
      - name: Build backend and capture log
        id: backend_build
        shell: bash
        run: |
          set +e
          npm run build > backend-build.log 2>&1
          status=$?
          cat backend-build.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload backend build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-log
          path: backend/backend-build.log
      - name: Fail when compilation failed
        if: steps.backend_build.outputs.status != '0'
        run: exit 1
