version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pingalert-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: file:./data/pingalert.db
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-production}
      FRONTEND_URL: http://localhost:3000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      OPENVPN_LOG_PATH: ${OPENVPN_LOG_PATH:-/openvpn/openvpn-status.log}
      VPN_WATCHDOG_STATUS_DIR: /vpn-watchdog/statuses
      VPN_WATCHDOG_STATUS_PATH: /vpn-watchdog/status.json
    ports:
      - "3001:3001"
    volumes:
      - pingalert_data:/app/prisma/data
      - ./.vpn-watchdog:/vpn-watchdog:ro
      # Opcional: monte o log do OpenVPN do host, se existir.
      # - "C:/caminho/openvpn-status.log:/openvpn/openvpn-status.log:ro"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: pingalert-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000

volumes:
  pingalert_data:
