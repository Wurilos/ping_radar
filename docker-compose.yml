version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pingalert-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: file:./data/pingalert.db
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-production}
      FRONTEND_URL: http://localhost:3000
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Administrador}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@pingalert.pro}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-admin123}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      OPENVPN_LOG_PATH: ${OPENVPN_LOG_PATH:-/openvpn/openvpn-status.log}
    ports:
      - "3001:3001"
    volumes:
      - pingalert_data:/app/prisma/data
      # Opcional: monte o log do OpenVPN do host, se existir.
      # - "C:/caminho/openvpn-status.log:/openvpn/openvpn-status.log:ro"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: pingalert-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000

volumes:
  pingalert_data:
